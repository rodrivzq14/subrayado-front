<header class="barra">
  <div class="barra-in">
    <a [routerLink]="auth.usuario() ? '/publicaciones' : '/login'" class="logo">Subrayado</a>
    <nav>
      <a routerLink="/publicaciones" routerLinkActive="activo">Reseñas</a>
      <a routerLink="/mi-perfil" routerLinkActive="activo">Mi estantería</a>
    </nav>
    <div class="sesion">
      @if (auth.usuario(); as u) {
        @if (u.imagenPerfil) { <img class="avatar" [src]="u.imagenPerfil" alt=""> }
        <span>{{ u.nombreUsuario }}</span>
        <button class="sec" (click)="salir()">Cerrar sesión</button>
      } @else {
        <a routerLink="/login">Ingresar</a>
        <a routerLink="/registro">Registrarse</a>
      }
    </div>
  </div>
</header>
<router-outlet />
<app-modal />
