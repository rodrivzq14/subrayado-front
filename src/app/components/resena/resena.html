<article class="resena">
  <div class="portada" [class.con-imagen]="resena.imagen">
    @if (resena.imagen) {
      <img [src]="resena.imagen" [alt]="'Portada de ' + resena.titulo">
    } @else {
      <span>{{ resena.titulo }}</span>
    }
  </div>

  <div class="cuerpo">
    <h2>{{ resena.titulo }}</h2>
    <div class="meta">
      @if (resena.autor?.imagenPerfil) { <img class="mini" [src]="resena.autor.imagenPerfil" alt=""> }
      <span>&#64;{{ resena.autor?.nombreUsuario }}</span>
      <span>{{ resena.createdAt | date:'dd/MM/yyyy' }}</span>
      @if (resena.calificacion) {
        <span class="estrellas" [attr.aria-label]="resena.calificacion + ' de 5 estrellas'">{{ estrellas }}</span>
      }
    </div>

    <p>{{ resena.mensaje }}</p>

    <div class="acciones">
      <button class="sec" [class.activo]="leGusto()" [disabled]="enCurso()" (click)="alternarMeGusta()">
  {{ leGusto() ? 'Recomendaste' : 'Recomendar' }} ({{ cantidad() }})
</button>
      @if (esMia) { <button class="sec peligro" (click)="eliminar()">Eliminar</button> }
    </div>
  </div>
</article>
