@if (modal.datos(); as d) {
  <div class="fondo" (click)="modal.cerrar()">
    <div class="ventana" role="dialog" aria-modal="true" [attr.data-tipo]="d.tipo" (click)="$event.stopPropagation()">
      <span class="icono">{{ d.tipo === 'exito' ? '✓' : d.tipo === 'error' ? '!' : 'i' }}</span>
      <h2>{{ d.titulo }}</h2>
      <p>{{ d.texto }}</p>
      <div class="acciones-modal"><button (click)="modal.cerrar()">Entendido</button></div>
    </div>
  </div>
}
