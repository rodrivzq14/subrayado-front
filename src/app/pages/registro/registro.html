<section class="auth">
  <aside class="auth-marca">
    <p class="lema">Lo que leés, subrayado.</p>
    <p>Armá tu estantería y compartí lo que estás leyendo.</p>
  </aside>

  <div class="auth-form">
    <div class="caja">
      <h1>Creá tu cuenta</h1>
      <p class="bajada">Sumate a Subrayado en un minuto.</p>

      <app-formulario-usuario textoBoton="Registrarme" [enviando]="enviando()" (enviar)="registrar($event)" />

      <p class="pie">¿Ya tenés cuenta? <a routerLink="/login">Ingresá</a></p>
    </div>
  </div>
</section>
